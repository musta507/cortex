<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Cortex</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#08080A;--card:rgba(255,255,255,.035);--card2:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--tx:#F5F5F7;--mut:#A1A1AA;--dim:#71717A;--blue:#6E97FF;--ok:#34D399;--warn:#FBBF24;--bad:#F87171;--ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.2,.9,.3,1.2);--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,rgba(59,110,246,.13),transparent 70%),radial-gradient(700px 420px at 0% 110%,rgba(110,151,255,.06),transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:14px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
::selection{background:rgba(110,151,255,.35)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--card2);color:var(--tx);border-radius:10px;padding:8px 14px;font-weight:700;transition:background-color .15s,border-color .15s,color .15s,transform .1s var(--ease),box-shadow .2s}
button:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.09)}
button:active{transform:scale(.97)}
button:focus-visible,a:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(110,151,255,.35)}
button.pri{background:#fff;color:#0A0A0C;border-color:#fff;box-shadow:0 6px 20px rgba(255,255,255,.08)}
button.pri:hover{background:#fff;box-shadow:0 8px 26px rgba(157,187,255,.25)}
input{background:rgba(0,0,0,.35);border:1px solid var(--line2);color:#fff;border-radius:10px;padding:10px 12px;outline:none;min-width:0;transition:border-color .15s,box-shadow .2s}
input:hover{border-color:rgba(255,255,255,.26)}
input:focus{border-color:rgba(110,151,255,.75);box-shadow:0 0 0 3px rgba(110,151,255,.25)}
::placeholder{color:#6E6E78}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,20px)}}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px 26px;background:rgba(8,8,10,.72);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.brand i{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#fff 30%,#8FB1FF);color:#08080A;font-style:normal;font-size:13px;box-shadow:0 6px 18px rgba(110,151,255,.3)}
.brand span{color:var(--dim);font-weight:600;font-size:14px;padding:3px 10px;border-radius:99px;border:1px solid var(--line2);margin-left:2px}
header .sp{flex:1}
header a{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600;padding:7px 12px;border-radius:9px;transition:background-color .15s,color .15s}
header a:hover{color:#fff;background:rgba(255,255,255,.06)}
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;padding:22px 26px 40px;max-width:1680px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr;padding:16px}header{padding:12px 16px}}
aside{display:grid;gap:14px;align-content:start;position:sticky;top:84px}
@media (max-width:900px){aside{position:static}}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;animation:up .45s var(--ease) backwards .06s}
h2{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:2px 4px 12px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;animation:up .45s var(--ease) backwards}
.kpi:nth-child(2){animation-delay:.04s}.kpi:nth-child(3){animation-delay:.08s}
.kpi::after{content:"";position:absolute;inset:auto -30px -40px auto;width:90px;height:90px;border-radius:50%;background:radial-gradient(closest-side,var(--c,rgba(110,151,255,.25)),transparent);pointer-events:none}
.kpi:nth-child(2){--c:rgba(251,191,36,.18)}.kpi:nth-child(3){--c:rgba(52,211,153,.2)}
.kpi b{display:block;font:700 26px/1.1 var(--mono);letter-spacing:-1px}
.kpi span{color:var(--mut);font-size:12px;font-weight:600}
.users{display:grid;gap:4px}
.u{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:13px;border:1px solid transparent;background:transparent;font-weight:500;animation:up .4s var(--ease) backwards}
.u:nth-child(2){animation-delay:.03s}.u:nth-child(3){animation-delay:.06s}.u:nth-child(4){animation-delay:.09s}.u:nth-child(n+5){animation-delay:.12s}
.u:hover{background:rgba(255,255,255,.05);border-color:var(--line)}
.u.on{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.22);box-shadow:inset 3px 0 0 #fff}
.u.on .m{color:var(--mut)}
.av{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;font-weight:800;font-size:15px;color:#fff;background:var(--g,linear-gradient(135deg,#3F3F46,#27272A));box-shadow:0 4px 12px rgba(0,0,0,.3)}
.u strong{display:block;font-weight:700;font-size:14.5px}
.m{color:var(--mut);font-size:12px}
.u .n{font:700 13px var(--mono);padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.06);color:#D4D4D8}
.u.on .n{background:#fff;color:#0A0A0C}
.tools{display:grid;gap:8px;margin-bottom:14px}
.add input{width:100%}
.add{display:grid;gap:9px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.add strong{font-size:14px}
.add .r{display:flex;gap:8px}
.add .r input{flex:1;font-family:var(--mono);font-size:13.5px}
.add .r button{width:44px;padding:0;font-size:16px}
.msg{font-size:12.5px;min-height:16px;line-height:1.45}
.msg.e{color:var(--bad)}.msg.ok{color:var(--ok)}
.msg:not(:empty){animation:up .3s var(--ease) backwards}
.uh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 18px;animation:up .4s var(--ease) backwards}
.uh h1{margin:0;font-size:26px;letter-spacing:-.6px;font-weight:800}
.uh .sp{flex:1}
#uActs{display:flex;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.p{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),border-color .2s,box-shadow .25s;animation:pop .4s var(--ease) backwards}
.p:nth-child(2){animation-delay:.03s}.p:nth-child(3){animation-delay:.06s}.p:nth-child(4){animation-delay:.09s}.p:nth-child(5){animation-delay:.12s}.p:nth-child(n+6){animation-delay:.15s}
.p:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.18);box-shadow:0 22px 50px rgba(0,0,0,.5)}
.th{position:relative;aspect-ratio:9/16;max-height:360px;background:#000 center/cover no-repeat;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.th::after{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:none}
.th.none{aspect-ratio:auto;height:130px;cursor:default;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 10px,rgba(255,255,255,.05) 10px 20px)}
.th.none::after{display:none}
.th .play{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:18px;padding-left:3px;transition:transform .25s var(--pop),background-color .2s}
.p:hover .th .play{transform:scale(1.12);background:rgba(255,255,255,.3)}
.th .tag{position:absolute;z-index:1;top:10px;left:10px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12)}
.pb{padding:13px 14px 14px;display:grid;gap:7px}
.pb strong{font-size:14.5px;line-height:1.35;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(255,255,255,.07);color:#D4D4D8}
.chip.ok{background:rgba(52,211,153,.13);color:var(--ok)}
.chip.w{background:rgba(251,191,36,.13);color:var(--warn)}
.acts{display:flex;gap:6px;margin-top:4px}
.acts a,.acts button{flex:1;text-align:center;padding:8px;border-radius:10px;font-size:12.5px;font-weight:700;text-decoration:none;color:var(--tx);border:1px solid var(--line2);background:rgba(255,255,255,.05);transition:background-color .15s,border-color .15s}
.acts a:hover,.acts button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.acts button:first-child{background:#fff;color:#0A0A0C;border-color:#fff}
.more{color:var(--mut);font-size:12px}
.more summary{cursor:pointer;font-weight:600}
.more ul{margin:6px 0 0;padding-left:16px}
.empty{grid-column:1/-1;color:var(--mut);padding:60px 20px;text-align:center;border:1px dashed var(--line2);border-radius:18px;font-size:14.5px;animation:up .4s var(--ease) backwards}
.empty::before{content:"🎬";display:block;font-size:34px;margin-bottom:10px}
.sk{border-radius:18px;height:420px;background:linear-gradient(90deg,rgba(255,255,255,.03) 0%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.03) 100%);background-size:200% 100%;animation:shim 1.3s linear infinite}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,520px);overflow:visible}
dialog[open]{animation:pop .25s var(--pop) backwards}
dialog::backdrop{background:rgba(0,0,0,.82);backdrop-filter:blur(6px)}
dialog video{display:block;max-height:86vh;max-width:100%;border-radius:18px;background:#000;box-shadow:0 30px 90px rgba(0,0,0,.7)}
dialog .x{position:absolute;top:-48px;right:0}
.danger{color:#FCA5A5;border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.06)}
.danger:hover{background:rgba(248,113,113,.14);border-color:rgba(248,113,113,.6);color:#fff}
body.ready .u,body.ready .p,body.ready .kpi,body.ready .uh,body.ready .box{animation:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><i>▶</i>Cortex <span>Panel</span></div>
  <div class="sp"></div>
  <a href="/" target="_blank" rel="noopener">Abrir la web ↗</a>
  <a href="/panel/salir">Salir</a>
</header>
<main>
  <aside>
    <div class="kpis"><div class="kpi"><b id="kU">–</b><span>clippers</span></div><div class="kpi"><b id="kP">–</b><span>proyectos</span></div><div class="kpi"><b id="kE">–</b><span>exportados</span></div></div>
    <div class="box">
      <h2>Clippers</h2>
      <div class="users" id="users"></div>
      <div class="tools"><button type="button" id="iaT">🧪 Probar la IA</button><div class="msg" id="iaM" style="white-space:pre-wrap"></div></div>
      <form class="add" id="add" autocomplete="off">
        <strong>Añadir clipper</strong>
        <input id="aName" placeholder="Nombre (para reconocerlo)" maxlength="40" required>
        <div class="r"><input id="aPass" placeholder="Su contraseña" required><button type="button" id="aGen" title="Inventar una contraseña">🎲</button></div>
        <button class="pri">Añadir</button>
        <div class="msg" id="aMsg"></div>
      </form>
    </div>
  </aside>
  <section>
    <div class="uh"><h1 id="uT">Todos los clips</h1><span class="m" id="uS"></span><div class="sp"></div><span id="uActs"></span></div>
    <div class="grid" id="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </section>
</main>
<dialog id="dlg"><button class="x" id="dlgX">✕ Cerrar</button><video id="dlgV" controls playsinline></video></dialog>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = t => { if (!t) return 'nunca'; const s = (Date.now() - t) / 1000; if (s < 60) return 'ahora'; if (s < 3600) return `hace ${Math.floor(s / 60)} min`; if (s < 86400) return `hace ${Math.floor(s / 3600)} h`; return new Date(t).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); };
const when = t => new Date(t).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const AVG = ['#6E97FF,#3B5BDB', '#F472B6,#BE185D', '#34D399,#047857', '#FBBF24,#B45309', '#A78BFA,#6D28D9', '#22D3EE,#0E7490', '#FB923C,#C2410C'];
const avBg = n => { let h = 0; for (const c of String(n)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `linear-gradient(135deg,${AVG[h % AVG.length]})`; };
const FMT = { horizontal: 'Horizontal', reaccion: 'Reacción', podcast: 'Podcast', dividida: 'Pantalla dividida', horizontal_cam: 'Solo cámara', duo: 'Dos personas' };
let sel = '', users = [];
async function api(p, body) {
  const r = await fetch('/api/admin/' + p, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.reload(); throw new Error('sesión'); }
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'error'); return j;
}
async function load() {
  const j = await api('resumen'); users = j.users;
  $('kU').textContent = users.length; $('kP').textContent = users.reduce((n, u) => n + u.proyectos, 0); $('kE').textContent = users.reduce((n, u) => n + u.exportados, 0);
  const box = $('users'); box.innerHTML = '';
  const row = (name, sub, n, key) => { const b = document.createElement('button'); b.className = 'u' + (sel === key ? ' on' : ''); b.innerHTML = `<span class="av" style="--g:${key ? avBg(name) : 'linear-gradient(135deg,#fff,#8FB1FF)'};${key ? '' : 'color:#0A0A0C'}">${esc(key ? name[0].toUpperCase() : '★')}</span><span><strong>${esc(name)}</strong><span class="m">${esc(sub)}</span></span><span class="n">${n}</span>`; b.onclick = () => { sel = key; document.body.classList.remove('ready'); $('grid').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>'; load().then(() => setTimeout(() => document.body.classList.add('ready'), 700)); }; box.append(b); };
  row('Todos', 'los clips de todos', users.reduce((n, u) => n + u.exportados, 0), '');
  for (const u of users) row(u.name, `${u.proyectos} proyecto${u.proyectos === 1 ? '' : 's'} · ${ago(u.ultimo)}`, u.exportados, u.name);
  if (!users.length) box.insertAdjacentHTML('beforeend', '<p class="m" style="margin:8px 4px">Aún no hay clippers. Añade el primero aquí abajo.</p>');
  await loadProjects();
}
async function loadProjects() {
  const u = users.find(x => x.name === sel);
  $('uT').textContent = sel ? sel : 'Todos los clips';
  $('uS').textContent = u ? `alta ${new Date(u.created).toLocaleDateString('es-ES')} · última vez ${ago(u.ultimo)}` : '';
  const acts = $('uActs'); acts.innerHTML = '';
  if (u) {
    const ch = document.createElement('button'); ch.textContent = '🔑 Cambiar contraseña'; ch.onclick = async () => { const p = prompt(`Nueva contraseña para ${u.name}:`); if (!p) return; try { await api('contrasena', { name: u.name, pass: p }); alert('Hecho. La contraseña anterior ya no sirve.'); } catch (e) { alert(e.message); } };
    const rm = document.createElement('button'); rm.className = 'danger'; rm.textContent = 'Quitar acceso'; rm.style.marginLeft = '8px'; rm.onclick = async () => { if (!confirm(`¿Quitar el acceso a ${u.name}? Sus clips se quedan en el panel.`)) return; await api('quitar', { name: u.name }); sel = ''; load(); };
    acts.append(ch, rm);
  }
  const { proyectos } = await api('proyectos' + (sel ? '?user=' + encodeURIComponent(sel) : ''));
  const g = $('grid'); g.innerHTML = '';
  if (!proyectos.length) { g.innerHTML = `<div class="empty">${sel ? esc(sel) + ' todavía no ha abierto ningún clip.' : 'Todavía no hay clips. Cuando los clippers entren y exporten, aparecerán aquí.'}</div>`; return; }
  for (const p of proyectos) {
    const last = p.exports[p.exports.length - 1], src = p.fuente, st = p.estado, c = document.createElement('div'); c.className = 'p';
    const show = last || src;   // lo exportado o, si no hay, el vídeo original que está editando
    const th = document.createElement('div'); th.className = 'th' + (show && show.thumb ? '' : ' none');
    if (show && show.thumb) th.style.backgroundImage = `url(/api/admin/archivo/${show.id}.jpg?t=${(st && st.at) || 0})`;
    th.innerHTML = show ? (show.video ? '<span class="play">▶</span>' : show.borrado ? '<span class="m">vídeo borrado (espacio)</span>' : '<span class="m">subiendo vídeo…</span>') : '<span class="m">sin vídeo</span>';
    if (!last && src) th.insertAdjacentHTML('beforeend', '<span class="tag" style="left:auto;right:8px">original</span>');
    if (!sel) th.insertAdjacentHTML('beforeend', `<span class="tag">${esc(p.user)}</span>`);
    if (show && show.video) th.onclick = () => play(show.id);
    const title = last ? last.titulo : (st && st.titulo && st.titulo !== 'Texto predeterminado' ? st.titulo : (p.origen || 'Clip sin exportar'));
    const chips = [];
    if (last) { chips.push(`<span class="chip ok">Exportado${p.exports.length > 1 ? ' ×' + p.exports.length : ''}</span>`); if (last.formato) chips.push(`<span class="chip">${esc(FMT[last.formato] || last.formato)}</span>`); if (last.duracion_s) chips.push(`<span class="chip">${Math.round(last.duracion_s)} s</span>`); if (last.titulo_ia && last.titulo_ia !== last.titulo) chips.push('<span class="chip w">Título cambiado a mano</span>'); }
    else { chips.push('<span class="chip w">En edición · sin exportar</span>'); if (st && st.formato) chips.push(`<span class="chip">${esc(FMT[st.formato] || st.formato)}</span>`); if (st && st.duracion_s) chips.push(`<span class="chip">${Math.round(st.duracion_s)} s</span>`); }
    const b = document.createElement('div'); b.className = 'pb';
    b.innerHTML = `<strong>${esc(title || 'Sin título')}</strong><div class="chips">${chips.join('')}</div>
      <span class="m">${sel ? '' : esc(p.user) + ' · '}abierto ${when(p.abierto)}${last ? ' · exportado ' + when(last.at) : ''}</span>
      ${p.origen && last ? `<span class="m" title="${esc(p.origen)}">de: ${esc(String(p.origen).slice(0, 60))}</span>` : ''}
      ${last && last.titulo_ia && last.titulo_ia !== last.titulo ? `<span class="m">La IA puso: «${esc(last.titulo_ia)}»</span>` : ''}
      ${!last && st && st.at ? `<span class="m">último cambio ${ago(st.at)}</span>` : ''}
      ${show && show.video ? `<div class="acts"><button data-v="${show.id}">▶ Ver${last ? '' : ' original'}</button><a href="/api/admin/archivo/${show.id}.mp4?descargar">⬇ Descargar</a></div>` : ''}
      ${p.exports.length > 1 ? `<details class="more"><summary>${p.exports.length} exportaciones</summary><ul>${p.exports.map(x => `<li>${when(x.at)} · ${esc(x.titulo || 'sin título')}${x.video ? ` · <a href="#" data-v="${x.id}" style="color:#fff">ver</a>` : ''}</li>`).join('')}</ul></details>` : ''}`;
    b.querySelectorAll('[data-v]').forEach(x => x.onclick = ev => { ev.preventDefault(); play(x.dataset.v); });
    c.append(th, b); g.append(c);
  }
}
function play(id) { const v = $('dlgV'); v.src = `/api/admin/archivo/${id}.mp4`; $('dlg').showModal(); v.play().catch(() => {}); }
$('dlgX').onclick = () => { $('dlgV').pause(); $('dlg').close(); };
$('dlg').addEventListener('close', () => { const v = $('dlgV'); v.pause(); v.removeAttribute('src'); v.load(); });
$('iaT').onclick = async () => {
  const m = $('iaM'); m.className = 'msg'; m.textContent = 'Probando…';
  try {
    const j = await (await fetch('/api/admin/ia')).json();
    if (j.ok) { m.className = 'msg ok'; m.textContent = '✅ La IA funciona (' + j.pruebas.find(x => x.ok).modelo + ').'; }
    else { m.className = 'msg e'; m.textContent = '❌ ' + (j.msg || 'La IA no responde.') + (j.pruebas ? '\n' + j.pruebas.map(x => `${x.modelo}: ${x.estado || ''} ${x.error}`).join('\n') : '') + (j.clave ? '\nClave puesta: ' + j.clave : ''); }
    if (j.errores_recientes && j.errores_recientes.length) m.textContent += '\n\nÚltimos fallos de la web:\n' + j.errores_recientes.map(x => `${new Date(x.at).toLocaleTimeString('es-ES')} ${x.modelo}: ${x.error}`).join('\n');
  } catch (e) { m.className = 'msg e'; m.textContent = 'No se pudo probar: ' + e.message; }
};
$('aGen').onclick = () => { const w = ['clip', 'viral', 'stream', 'corte', 'reel', 'kick', 'live', 'top']; $('aPass').value = w[Math.floor(Math.random() * w.length)] + '-' + Math.floor(1000 + Math.random() * 9000); };
$('add').onsubmit = async ev => {
  ev.preventDefault(); const m = $('aMsg'); m.className = 'msg'; m.textContent = '';
  try { await api('clippers', { name: $('aName').value, pass: $('aPass').value }); m.className = 'msg ok'; m.textContent = `Hecho. Pásale a ${$('aName').value} esta contraseña: ${$('aPass').value}`; $('aName').value = ''; $('aPass').value = ''; load(); }
  catch (e) { m.className = 'msg e'; m.textContent = e.message; }
};
let firstDone = false;
load().then(() => setTimeout(() => document.body.classList.add('ready'), 900));   // tras la primera vez, al refrescar no se repiten las animaciones
setInterval(() => { if (!$('dlg').open && document.visibilityState === 'visible') load().catch(() => {}); }, 20000);
</script>
