<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel · Cortex</title>
<style>
:root{color-scheme:dark;--bg:#0A0A0C;--card:#111114;--line:#27272A;--line2:#3F3F46;--tx:#F4F4F5;--mut:#A1A1AA;--dim:#71717A;--ok:#34D399;--warn:#FBBF24;--bad:#F87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:#18181B;color:var(--tx);border-radius:10px;padding:8px 14px;font-weight:600}
button:hover{border-color:#71717A}
button.pri{background:#fff;color:#111;border-color:#fff}
input{background:var(--bg);border:1px solid var(--line2);color:#fff;border-radius:10px;padding:9px 12px;outline:none;min-width:0}
input:focus{border-color:#fff}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 22px;background:rgba(10,10,12,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:#fff;color:#111;font-style:normal;font-size:13px}
.brand span{color:var(--dim);font-weight:600}
header .sp{flex:1}
header a{color:var(--mut);text-decoration:none;font-size:13px}
main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;padding:20px 22px;max-width:1600px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:12px}
.users{display:grid;gap:6px}
.u{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:12px;border:1px solid transparent;background:transparent;font-weight:500}
.u:hover{background:#18181B;border-color:var(--line)}
.u.on{background:#fff;color:#111;border-color:#fff}
.u.on .m{color:#52525B}
.av{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#27272A;font-weight:800;font-size:14px;color:#fff}
.u.on .av{background:#111}
.u strong{display:block;font-weight:700}
.m{color:var(--mut);font-size:12px}
.u .n{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px}
.add input{width:100%}
.add{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.add .r{display:flex;gap:8px}
.add .r input{flex:1}
.msg{font-size:12px;min-height:16px}
.msg.e{color:var(--bad)}.msg.ok{color:var(--ok)}
.uh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.uh h1{margin:0;font-size:22px}
.uh .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.th{position:relative;aspect-ratio:9/16;max-height:340px;background:#000 center/cover no-repeat;display:grid;place-items:center;cursor:pointer}
.th.none{aspect-ratio:auto;height:120px;cursor:default;background:#18181B}
.th .play{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:18px}
.th .tag{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(0,0,0,.65)}
.pb{padding:12px;display:grid;gap:6px}
.pb strong{font-size:14px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#27272A;color:#D4D4D8}
.chip.ok{background:rgba(52,211,153,.14);color:var(--ok)}
.chip.w{background:rgba(251,191,36,.14);color:var(--warn)}
.acts{display:flex;gap:6px;margin-top:4px}
.acts a,.acts button{flex:1;text-align:center;padding:7px;border-radius:9px;font-size:12px;font-weight:700;text-decoration:none;color:var(--tx);border:1px solid var(--line2);background:#18181B}
.more{color:var(--mut);font-size:12px}
.more summary{cursor:pointer}
.more ul{margin:6px 0 0;padding-left:16px}
.empty{color:var(--mut);padding:40px;text-align:center;border:1px dashed var(--line2);border-radius:14px}
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,520px)}
dialog::backdrop{background:rgba(0,0,0,.8)}
dialog video{display:block;max-height:86vh;max-width:100%;border-radius:14px;background:#000}
dialog .x{position:absolute;top:-44px;right:0}
.danger{color:var(--bad);border-color:rgba(248,113,113,.4)}
</style>
</head>
<body>
<header>
  <div class="brand"><i>▶</i>Cortex <span>· Panel</span></div>
  <div class="sp"></div>
  <a href="/" target="_blank" rel="noopener">Abrir la web ↗</a>
  <a href="/panel/salir">Salir</a>
</header>
<main>
  <aside>
    <div class="kpis"><div class="kpi"><b id="kU">–</b><span>clippers</span></div><div class="kpi"><b id="kP">–</b><span>proyectos</span></div><div class="kpi"><b id="kE">–</b><span>exportados</span></div></div>
    <div class="box">
      <h2>Clippers</h2>
      <div class="users" id="users"></div>
      <div class="add" style="margin-top:0;border-top:0;padding-top:0;margin-bottom:14px"><button type="button" id="iaT">🧪 Probar la IA</button><div class="msg" id="iaM" style="white-space:pre-wrap"></div></div>
      <form class="add" id="add" autocomplete="off">
        <strong>Añadir clipper</strong>
        <input id="aName" placeholder="Nombre (para reconocerlo)" maxlength="40" required>
        <div class="r"><input id="aPass" placeholder="Su contraseña" required><button type="button" id="aGen" title="Inventar una contraseña">🎲</button></div>
        <button class="pri">Añadir</button>
        <div class="msg" id="aMsg"></div>
      </form>
    </div>
  </aside>
  <section>
    <div class="uh"><h1 id="uT">Todos los clips</h1><span class="m" id="uS"></span><div class="sp"></div><span id="uActs"></span></div>
    <div class="grid" id="grid"></div>
  </section>
</main>
<dialog id="dlg"><button class="x" id="dlgX">✕ Cerrar</button><video id="dlgV" controls playsinline></video></dialog>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = t => { if (!t) return 'nunca'; const s = (Date.now() - t) / 1000; if (s < 60) return 'ahora'; if (s < 3600) return `hace ${Math.floor(s / 60)} min`; if (s < 86400) return `hace ${Math.floor(s / 3600)} h`; return new Date(t).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); };
const when = t => new Date(t).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const FMT = { horizontal: 'Horizontal', reaccion: 'Reacción', podcast: 'Podcast', dividida: 'Pantalla dividida', horizontal_cam: 'Solo cámara', duo: 'Dos personas' };
let sel = '', users = [];
async function api(p, body) {
  const r = await fetch('/api/admin/' + p, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.reload(); throw new Error('sesión'); }
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'error'); return j;
}
async function load() {
  const j = await api('resumen'); users = j.users;
  $('kU').textContent = users.length; $('kP').textContent = users.reduce((n, u) => n + u.proyectos, 0); $('kE').textContent = users.reduce((n, u) => n + u.exportados, 0);
  const box = $('users'); box.innerHTML = '';
  const row = (name, sub, n, key) => { const b = document.createElement('button'); b.className = 'u' + (sel === key ? ' on' : ''); b.innerHTML = `<span class="av">${esc(key ? name[0].toUpperCase() : '★')}</span><span><strong>${esc(name)}</strong><span class="m">${esc(sub)}</span></span><span class="n">${n}</span>`; b.onclick = () => { sel = key; load(); }; box.append(b); };
  row('Todos', 'los clips de todos', users.reduce((n, u) => n + u.exportados, 0), '');
  for (const u of users) row(u.name, `${u.proyectos} proyecto${u.proyectos === 1 ? '' : 's'} · ${ago(u.ultimo)}`, u.exportados, u.name);
  if (!users.length) box.insertAdjacentHTML('beforeend', '<p class="m" style="margin:8px 4px">Aún no hay clippers. Añade el primero aquí abajo.</p>');
  await loadProjects();
}
async function loadProjects() {
  const u = users.find(x => x.name === sel);
  $('uT').textContent = sel ? sel : 'Todos los clips';
  $('uS').textContent = u ? `alta ${new Date(u.created).toLocaleDateString('es-ES')} · última vez ${ago(u.ultimo)}` : '';
  const acts = $('uActs'); acts.innerHTML = '';
  if (u) {
    const ch = document.createElement('button'); ch.textContent = '🔑 Cambiar contraseña'; ch.onclick = async () => { const p = prompt(`Nueva contraseña para ${u.name}:`); if (!p) return; try { await api('contrasena', { name: u.name, pass: p }); alert('Hecho. La contraseña anterior ya no sirve.'); } catch (e) { alert(e.message); } };
    const rm = document.createElement('button'); rm.className = 'danger'; rm.textContent = 'Quitar acceso'; rm.style.marginLeft = '8px'; rm.onclick = async () => { if (!confirm(`¿Quitar el acceso a ${u.name}? Sus clips se quedan en el panel.`)) return; await api('quitar', { name: u.name }); sel = ''; load(); };
    acts.append(ch, rm);
  }
  const { proyectos } = await api('proyectos' + (sel ? '?user=' + encodeURIComponent(sel) : ''));
  const g = $('grid'); g.innerHTML = '';
  if (!proyectos.length) { g.innerHTML = `<div class="empty">${sel ? esc(sel) + ' todavía no ha abierto ningún clip.' : 'Todavía no hay clips. Cuando los clippers entren y exporten, aparecerán aquí.'}</div>`; return; }
  for (const p of proyectos) {
    const last = p.exports[p.exports.length - 1], src = p.fuente, st = p.estado, c = document.createElement('div'); c.className = 'p';
    const show = last || src;   // lo exportado o, si no hay, el vídeo original que está editando
    const th = document.createElement('div'); th.className = 'th' + (show && show.thumb ? '' : ' none');
    if (show && show.thumb) th.style.backgroundImage = `url(/api/admin/archivo/${show.id}.jpg?t=${(st && st.at) || 0})`;
    th.innerHTML = show ? (show.video ? '<span class="play">▶</span>' : show.borrado ? '<span class="m">vídeo borrado (espacio)</span>' : '<span class="m">subiendo vídeo…</span>') : '<span class="m">sin vídeo</span>';
    if (!last && src) th.insertAdjacentHTML('beforeend', '<span class="tag" style="left:auto;right:8px">original</span>');
    if (!sel) th.insertAdjacentHTML('beforeend', `<span class="tag">${esc(p.user)}</span>`);
    if (show && show.video) th.onclick = () => play(show.id);
    const title = last ? last.titulo : (st && st.titulo && st.titulo !== 'Texto predeterminado' ? st.titulo : (p.origen || 'Clip sin exportar'));
    const chips = [];
    if (last) { chips.push(`<span class="chip ok">Exportado${p.exports.length > 1 ? ' ×' + p.exports.length : ''}</span>`); if (last.formato) chips.push(`<span class="chip">${esc(FMT[last.formato] || last.formato)}</span>`); if (last.duracion_s) chips.push(`<span class="chip">${Math.round(last.duracion_s)} s</span>`); if (last.titulo_ia && last.titulo_ia !== last.titulo) chips.push('<span class="chip w">Título cambiado a mano</span>'); }
    else { chips.push('<span class="chip w">En edición · sin exportar</span>'); if (st && st.formato) chips.push(`<span class="chip">${esc(FMT[st.formato] || st.formato)}</span>`); if (st && st.duracion_s) chips.push(`<span class="chip">${Math.round(st.duracion_s)} s</span>`); }
    const b = document.createElement('div'); b.className = 'pb';
    b.innerHTML = `<strong>${esc(title || 'Sin título')}</strong><div class="chips">${chips.join('')}</div>
      <span class="m">${sel ? '' : esc(p.user) + ' · '}abierto ${when(p.abierto)}${last ? ' · exportado ' + when(last.at) : ''}</span>
      ${p.origen && last ? `<span class="m" title="${esc(p.origen)}">de: ${esc(String(p.origen).slice(0, 60))}</span>` : ''}
      ${last && last.titulo_ia && last.titulo_ia !== last.titulo ? `<span class="m">La IA puso: «${esc(last.titulo_ia)}»</span>` : ''}
      ${!last && st && st.at ? `<span class="m">último cambio ${ago(st.at)}</span>` : ''}
      ${show && show.video ? `<div class="acts"><button data-v="${show.id}">▶ Ver${last ? '' : ' original'}</button><a href="/api/admin/archivo/${show.id}.mp4?descargar">⬇ Descargar</a></div>` : ''}
      ${p.exports.length > 1 ? `<details class="more"><summary>${p.exports.length} exportaciones</summary><ul>${p.exports.map(x => `<li>${when(x.at)} · ${esc(x.titulo || 'sin título')}${x.video ? ` · <a href="#" data-v="${x.id}" style="color:#fff">ver</a>` : ''}</li>`).join('')}</ul></details>` : ''}`;
    b.querySelectorAll('[data-v]').forEach(x => x.onclick = ev => { ev.preventDefault(); play(x.dataset.v); });
    c.append(th, b); g.append(c);
  }
}
function play(id) { const v = $('dlgV'); v.src = `/api/admin/archivo/${id}.mp4`; $('dlg').showModal(); v.play().catch(() => {}); }
$('dlgX').onclick = () => { $('dlgV').pause(); $('dlg').close(); };
$('dlg').addEventListener('close', () => { const v = $('dlgV'); v.pause(); v.removeAttribute('src'); v.load(); });
$('iaT').onclick = async () => {
  const m = $('iaM'); m.className = 'msg'; m.textContent = 'Probando…';
  try {
    const j = await (await fetch('/api/admin/ia')).json();
    if (j.ok) { m.className = 'msg ok'; m.textContent = '✅ La IA funciona (' + j.pruebas.find(x => x.ok).modelo + ').'; }
    else { m.className = 'msg e'; m.textContent = '❌ ' + (j.msg || 'La IA no responde.') + (j.pruebas ? '\n' + j.pruebas.map(x => `${x.modelo}: ${x.estado || ''} ${x.error}`).join('\n') : '') + (j.clave ? '\nClave puesta: ' + j.clave : ''); }
    if (j.errores_recientes && j.errores_recientes.length) m.textContent += '\n\nÚltimos fallos de la web:\n' + j.errores_recientes.map(x => `${new Date(x.at).toLocaleTimeString('es-ES')} ${x.modelo}: ${x.error}`).join('\n');
  } catch (e) { m.className = 'msg e'; m.textContent = 'No se pudo probar: ' + e.message; }
};
$('aGen').onclick = () => { const w = ['clip', 'viral', 'stream', 'corte', 'reel', 'kick', 'live', 'top']; $('aPass').value = w[Math.floor(Math.random() * w.length)] + '-' + Math.floor(1000 + Math.random() * 9000); };
$('add').onsubmit = async ev => {
  ev.preventDefault(); const m = $('aMsg'); m.className = 'msg'; m.textContent = '';
  try { await api('clippers', { name: $('aName').value, pass: $('aPass').value }); m.className = 'msg ok'; m.textContent = `Hecho. Pásale a ${$('aName').value} esta contraseña: ${$('aPass').value}`; $('aName').value = ''; $('aPass').value = ''; load(); }
  catch (e) { m.className = 'msg e'; m.textContent = e.message; }
};
load(); setInterval(() => { if (!$('dlg').open && document.visibilityState === 'visible') load().catch(() => {}); }, 20000);
</script>
</body>
</html>
